[package]
name = "clawdtoast"
version = "0.1.0"
edition = "2021"
description = "A tiny Clawd that pops up when Claude Code finishes or needs you"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
png = "0.17"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSArray", "NSThread", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSResponder", "NSScreen", "NSEvent", "NSGraphics", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# macOS: honour alpha so the card has rounded, transparent corners (see vendor/softbuffer/PATCH.md).
softbuffer = { path = "vendor/softbuffer" }
